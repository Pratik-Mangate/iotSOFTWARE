{% extends "base.html" %}
{% block title %}Error {{ code }} &mdash; DermaScan Clinical AI{% endblock %}

{% block content %}
<div class="error-layout fade-in">
    <div class="error-badge">{{ code }}</div>
    <h2>System Notification</h2>
    <p class="error-desc">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
